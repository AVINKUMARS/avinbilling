services:
  - type: web
    name: avin-business-suite-api
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build -w @meera/api
    startCommand: npm run start -w @meera/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
  - type: web
    name: avin-business-suite-web
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build -w @meera/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
